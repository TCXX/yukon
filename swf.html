<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>SWF Viewer</title>

        <!-- Ruffle -->
        <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.min.js"></script>

        <style>
            html, body { margin: 0; height: 100%; background: #1a1a1a; color: #eee; font-family: sans-serif; }
            [hidden] { display: none !important; }
            a { color: #8cf; }
            a.active { color: #fff; font-weight: bold; text-decoration: none; }
            main { height: 100%; display: flex; }
            nav, aside { overflow-y: auto; border-right: 1px solid #333; font-size: 13px; }
            nav { width: 200px; flex-shrink: 0; }
            aside { width: 260px; flex-shrink: 0; }
            nav h3, aside h3 { margin: 12px 12px 4px; font-size: 11px; text-transform: uppercase; color: #888; }
            nav input, aside input { box-sizing: border-box; width: calc(100% - 24px); margin: 8px 12px; padding: 4px 6px; background: #111; color: #eee; border: 1px solid #444; }
            nav summary { padding: 6px 12px 3px; cursor: pointer; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            nav details { padding-left: 12px; }
            nav summary { margin-left: -12px; }
            nav a, aside a { display: block; padding: 3px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            nav a.active, aside a.active { background: #2a3a4a; }
            #player { flex: 1; min-width: 0; position: relative; }
            #cells { position: absolute; inset: 0; pointer-events: none; }
            #cells a { position: absolute; pointer-events: auto; padding: 0; box-sizing: border-box; }
            #cells a:hover { outline: 2px solid #8cf; outline-offset: -2px; background: rgba(136, 204, 255, 0.1); }
            .row { display: flex; align-items: center; }
            .row a { flex: 1; min-width: 0; }
            button.mark { flex-shrink: 0; padding: 0 3px; background: none; border: 0; color: #eee; font-size: 12px; cursor: pointer; opacity: 0.15; }
            .row button.mark:last-child { margin-right: 8px; }
            .row:hover button.mark, #cells .marks:hover button.mark { opacity: 0.5; }
            button.mark.on { opacity: 1 !important; }
            button.mark.impression.on { color: #7d7; }
            button.mark.favorite.on { color: #fc4; }
            #cells .marks { position: absolute; z-index: 2; pointer-events: auto; display: flex; background: rgba(0, 0, 0, 0.5); border-radius: 0 0 0 4px; }
            #cells .marks button.mark { opacity: 0.4; padding: 1px 4px; }
            #player .error { margin: 16px; color: #f88; }
            #player .hint { margin: 16px; color: #888; }
            #player ruffle-player { width: 100%; height: 100%; }
            /* In grid views the player sits above the cells but lets clicks through, except on its unmute button */
            #player.grid ruffle-player { position: relative; z-index: 1; pointer-events: none; }
        </style>
    </head>

    <body>
        <!-- Files are listed in assets/swf/swf.json, generated from the folder by utils/swf-list.js -->
        <main>
            <nav>
                <input type="search" placeholder="Filter files">
            </nav>

            <aside>
                <input type="search" placeholder="Filter elements">
                <div id="views"></div>
            </aside>

            <div id="player"></div>
        </main>

        <script type="module">
            import { readSwf, hideLayers, symbolClasses, scenes, frames, buildScene, buildElement, buildFrames, buildAll } from './utils/swf-stage.js'

            const params = new URLSearchParams(location.search)
            const encodePath = source => source.split('/').map(encodeURIComponent).join('/')
            const [tree, loadedMarks] = await Promise.all([
                fetch('assets/swf/swf.json').then(res => res.json()),
                fetch('swf-marks').then(res => res.ok ? res.json() : null).catch(() => null)
            ])
            const leaves = nodes => nodes.flatMap(node => node.children ? leaves(node.children) : [node])
            // Nothing is loaded until a file is picked
            const file = params.get('file')

            // Layers the game hides at runtime (collision maps etc.) are hidden unless ?layers=all
            const showLayers = params.get('layers') === 'all'

            const href = (file, view, frame, layers = showLayers, page) => `?file=${encodeURIComponent(file)}` + (view ? `&view=${view}` : '')
                + (frame ? `&frame=${frame}` : '') + (page ? `&page=${page}` : '') + (layers ? '&layers=all' : '')

            function link(parent, text, url, active, title) {
                const a = document.createElement('a')

                a.href = url
                a.textContent = text
                a.title = title || text
                a.classList.toggle('active', active)
                parent.appendChild(a)

                return a
            }

            // Files and elements can be marked "impression" (I remember it from the game) and "favorite" (I'll revisit it)
            // Marks are saved to swf-marks.txt by the dev server; without it they can't be loaded or changed
            let marks = loadedMarks

            const markTypes = [
                { mark: 'impression', text: '✓', title: 'Impression: I have an impression of it from the game' },
                { mark: 'favorite', text: '★', title: "Favorite: I'll revisit it" }
            ]

            // Files are identified by the start of their SHA-256, so marks follow them when renamed
            const hashes = new Map()

            async function digest(buffer) {
                const bytes = new Uint8Array(await crypto.subtle.digest('SHA-256', buffer))

                return [...bytes.slice(0, 8)].map(b => b.toString(16).padStart(2, '0')).join('')
            }

            async function hashOf(source) {
                if (!hashes.has(source)) {
                    const res = await fetch(`assets/swf/${encodePath(source)}`)

                    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)

                    hashes.set(source, await digest(await res.arrayBuffer()))
                }

                return hashes.get(source)
            }

            // Files not hashed yet (not loaded or marked in this page) are matched by path
            const findMark = ({ file, id = null }) => marks?.find(entry => entry.id === id
                && (hashes.has(file) ? entry.hash === hashes.get(file) : entry.file === file))

            const markButtons = []

            function refreshMarks() {
                markButtons.forEach(({ button, target, mark }) => button.classList.toggle('on', !!findMark(target)?.marks.includes(mark)))
            }

            async function toggleMark(target, mark) {
                try {
                    const hash = await hashOf(target.file)
                    const current = findMark(target)?.marks || []
                    const next = current.includes(mark) ? current.filter(m => m !== mark) : [...current, mark]
                    const res = await fetch('swf-marks', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ hash, file: target.file, id: target.id ?? null, name: target.name ?? null, marks: next })
                    })

                    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText)

                    marks = await res.json()
                } catch (error) {
                    alert(`Could not save mark: ${error.message}`)
                }

                refreshMarks()
            }

            // Adds a toggle button for each mark to parent, for a file ({ file }) or an element ({ file, id, name })
            function addMarks(parent, target) {
                if (!marks) return

                const entry = findMark(target)

                for (const { mark, text, title } of markTypes) {
                    const button = document.createElement('button')

                    button.className = `mark ${mark}`
                    button.classList.toggle('on', !!entry?.marks.includes(mark))
                    button.textContent = text
                    button.title = title
                    button.addEventListener('click', e => {
                        e.preventDefault()
                        e.stopPropagation()
                        toggleMark(target, mark)
                    })
                    parent.appendChild(button)
                    markButtons.push({ button, target, mark })
                }
            }

            // A link with mark buttons beside it; filters hide the whole row
            function markableLink(parent, target, ...args) {
                const row = document.createElement('div')

                row.className = 'row'
                parent.appendChild(row)

                const a = link(row, ...args)

                addMarks(row, target)

                return a
            }

            function heading(parent, text) {
                const h = document.createElement('h3')

                h.textContent = text
                parent.appendChild(h)
            }

            const nav = document.querySelector('nav')

            heading(nav, `Files (${leaves(tree).length})`)

            // The file list's scroll position and open folders are kept across page loads, so it stays put
            // when switching files (even if the new file fails to load)
            // Opening the page without a file starts with every folder collapsed
            const saved = file && (() => {
                try {
                    return JSON.parse(sessionStorage.getItem('swf-nav'))
                } catch {
                    return null
                }
            })()

            const openFolders = new Set(saved?.open)

            // Folders become collapsible sections, opened when they contain the current file or were left open
            function addFiles(parent, nodes, prefix = '') {
                for (const node of nodes) {
                    if (!node.children) {
                        markableLink(parent, { file: node.source }, node.label, href(node.source), node.source === file, node.source)
                        continue
                    }

                    const details = document.createElement('details')
                    const summary = document.createElement('summary')

                    details.dataset.path = prefix + node.label
                    summary.textContent = `${node.label} (${leaves(node.children).length})`
                    summary.title = summary.textContent
                    details.appendChild(summary)
                    addFiles(details, node.children, details.dataset.path + '/')
                    details.open = openFolders.has(details.dataset.path) || !!details.querySelector('a.active')
                    parent.appendChild(details)
                }
            }

            addFiles(nav, tree)

            if (saved) {
                nav.scrollTop = saved.scroll
            } else {
                nav.querySelector('a.active')?.scrollIntoView({ block: 'center' })
            }

            addEventListener('pagehide', () => {
                // While filtering, folders are opened by the filter, so keep the previous set
                const open = nav.querySelector('input').value
                    ? [...openFolders]
                    : [...nav.querySelectorAll('details[open]')].map(details => details.dataset.path)

                try {
                    sessionStorage.setItem('swf-nav', JSON.stringify({ scroll: nav.scrollTop, open }))
                } catch {}
            })

            const fileLinks = [...nav.querySelectorAll('a')]
            const folders = [...nav.querySelectorAll('details')]

            nav.querySelector('input').addEventListener('input', e => {
                const query = e.target.value.toLowerCase()

                fileLinks.forEach(a => a.parentElement.hidden = !(a.textContent + a.title).toLowerCase().includes(query))
                folders.forEach(details => {
                    const matches = !!details.querySelector('.row:not([hidden])')

                    details.hidden = !matches
                    details.open = query ? matches : openFolders.has(details.dataset.path) || !!details.querySelector('a.active')
                })
            })

            if (!file) {
                const p = document.createElement('p')

                p.className = 'hint'
                p.textContent = 'Pick a file to load it'
                document.getElementById('player').replaceChildren(p)

                // Module scripts can't return early, so wait forever instead of loading anything
                await new Promise(() => {})
            }

            function showError(error) {
                const p = document.createElement('p')

                p.className = 'error'
                p.textContent = `Could not load ${file}: ${error.message}`
                document.getElementById('player').replaceChildren(p)

                throw error
            }

            let swf

            try {
                const res = await fetch(`assets/swf/${encodePath(file)}`)

                if (!res.ok) {
                    throw new Error(`${res.status} ${res.statusText}`)
                }

                const buffer = await res.arrayBuffer()

                hashes.set(file, await digest(buffer))
                refreshMarks()
                swf = await readSwf(buffer)

                if (!showLayers) swf = hideLayers(swf)
            } catch (error) {
                showError(error)
            }
            const sceneList = scenes(swf)
            const elements = symbolClasses(swf.tags).filter(s => s.id !== 0)

            // Code-driven files usually have an empty main timeline, so start on their elements
            const view = params.get('view') || (elements.length ? 'all' : 'scene-0')

            const views = document.getElementById('views')

            if (showLayers || swf.hiddenLayers) {
                heading(views, 'Layers')
                link(views, showLayers ? 'Hide runtime-hidden layers' : `Show ${swf.hiddenLayers} hidden layer${swf.hiddenLayers === 1 ? '' : 's'}`,
                    href(file, params.get('view'), params.get('frame'), !showLayers, params.get('page')), false)
            }

            heading(views, 'Scenes')
            sceneList.forEach((scene, i) => {
                const frames = scene.end - scene.start
                link(views, `${scene.name} (${frames} frame${frames === 1 ? '' : 's'})`, href(file, `scene-${i}`), view === `scene-${i}`)
            })

            heading(views, `Elements (${elements.length})`)

            // The "all" grid is split into pages of this many elements, as rendering them all at once is slow
            const pageSize = 20
            const page = Math.max(1, Number(params.get('page')) || 1)

            // Page links are added once the grid is built and its page count is known
            const allLink = elements.length ? link(views, 'All elements', href(file, 'all'), view === 'all') : null

            const elementLinks = elements.map(({ id, name }) => {
                const { count } = frames(swf, id)
                const text = name.split('.').pop() + (count > 1 ? ` · ${count}f` : '')

                return markableLink(views, { file, id, name }, text, href(file, id), view === String(id), `${name} (#${id})`)
            })

            // Multi-frame elements (catalog pages, button states, animations) can be viewed frame by frame
            const selected = elements.find(s => String(s.id) === view)
            const frameInfo = selected ? frames(swf, selected.id) : { count: 1, labels: [] }
            const frame = params.get('frame') || (frameInfo.count > 1 ? 'all' : 'play')

            let allFramesLink

            if (frameInfo.count > 1) {
                const section = document.createElement('div')

                heading(section, `Frames of ${selected.name.split('.').pop()}`)
                allFramesLink = link(section, 'All frames', href(file, view, 'all'), frame === 'all')
                link(section, 'Play', href(file, view, 'play'), frame === 'play')

                for (let i = 0; i < frameInfo.count; i++) {
                    const labels = frameInfo.labels.filter(l => l.frame === i).map(l => l.name)
                    link(section, `Frame ${i + 1}` + (labels.length ? ` (${labels.join(', ')})` : ''), href(file, view, i + 1), frame === String(i + 1))
                }

                views.prepend(section)
            }

            document.querySelector('aside input').addEventListener('input', e => {
                const query = e.target.value.toLowerCase()

                elementLinks.forEach(a => a.parentElement.hidden = !a.title.toLowerCase().includes(query))
            })

            document.querySelector('aside .active')?.scrollIntoView({ block: 'center' })

            let data, grid

            // Once a paged grid is built, list its pages under the link that opens it
            function pageLinks(parent, text, pageHref) {
                if (grid.pages <= 1) return

                parent.textContent = `${text} (${page}/${grid.pages})`
                parent.classList.remove('active')

                for (let i = grid.pages; i >= 1; i--) {
                    const a = link(parent.parentElement, `Page ${i}`, pageHref(i), page === i)

                    a.style.paddingLeft = '24px'
                    parent.after(a)
                }
            }

            try {
                if (view === 'all') {
                    grid = buildAll(swf, page - 1, pageSize)
                    pageLinks(allLink, 'All elements', i => href(file, 'all', null, showLayers, i))
                } else if (view.startsWith('scene-')) {
                    data = buildScene(swf, sceneList[Number(view.slice(6))] || sceneList[0])
                } else if (frame === 'all') {
                    grid = buildFrames(swf, Number(view), page - 1, pageSize)
                    pageLinks(allFramesLink, 'All frames', i => href(file, view, 'all', showLayers, i))
                } else {
                    data = buildElement(swf, Number(view), frame === 'play' ? null : Number(frame) - 1)
                }
            } catch (error) {
                showError(error)
            }

            const player = window.RufflePlayer.newest().createPlayer()
            const container = document.getElementById('player')

            container.appendChild(player)

            // Ruffle's "click to unmute" overlay covers the whole stage, so shrink it to a button in the corner
            const unmuteStyle = document.createElement('style')

            unmuteStyle.textContent = `
                #unmute-overlay { inset: auto 12px 12px auto; width: 48px; height: 48px; border-radius: 8px; overflow: hidden; pointer-events: auto; }
                #unmute-overlay .background { opacity: 0.6; }
                #unmute-overlay .icon { width: 70%; height: 70%; }
                #unmute-text { display: none; }
            `
            player.shadowRoot.appendChild(unmuteStyle)
            player.shadowRoot.getElementById('unmute-overlay')?.setAttribute('title', 'Click to unmute')
            container.classList.toggle('grid', !!grid)

            // Grid views get a clickable cell over each element or frame, leading to its own view
            if (grid) {
                const cells = document.createElement('div')

                cells.id = 'cells'
                container.appendChild(cells)

                const links = grid.cells.map(cell => cell.frame === undefined
                    ? link(cells, '', href(file, cell.id), false, `${cell.name} (#${cell.id})`)
                    : link(cells, '', href(file, view, cell.frame + 1), false, `Frame ${cell.frame + 1}`))

                // Element cells get their mark buttons in the top right corner
                const markBoxes = grid.cells.map(cell => {
                    if (cell.frame !== undefined || !marks) return null

                    const box = document.createElement('div')

                    box.className = 'marks'
                    addMarks(box, { file, id: cell.id, name: cell.name })
                    cells.appendChild(box)

                    return box
                })

                // Ruffle scales the stage to fit the player and centres it
                const layout = () => {
                    const scale = Math.min(player.clientWidth / grid.width, player.clientHeight / grid.height)
                    const left = (player.clientWidth - grid.width * scale) / 2
                    const top = (player.clientHeight - grid.height * scale) / 2

                    grid.cells.forEach((cell, i) => {
                        Object.assign(links[i].style, {
                            left: `${left + cell.x * scale}px`,
                            top: `${top + cell.y * scale}px`,
                            width: `${cell.width * scale}px`,
                            height: `${cell.height * scale}px`
                        })

                        if (markBoxes[i]) Object.assign(markBoxes[i].style, {
                            right: `${player.clientWidth - left - (cell.x + cell.width) * scale}px`,
                            top: `${top + cell.y * scale}px`
                        })
                    })
                }

                layout()
                new ResizeObserver(layout).observe(player)
            }

            player.load({
                data: grid ? grid.data : data,
                allowScriptAccess: false,
                autoplay: 'on',
                splashScreen: false
            })
        </script>
    </body>

</html>
